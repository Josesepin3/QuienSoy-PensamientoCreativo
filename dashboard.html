<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién Soy? - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      align-items: stretch;
      justify-content: stretch;
    }

    .dashboard {
      width: 100%;
      height: 100vh;
      padding: 48px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 64px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dashboard-title {
      font-size: 24px;
      font-weight: 700;
    }

    .progress-bar {
      width: 400px;
    }

    .header-right {
      text-align: right;
      display: flex;
      align-items: flex-start;
      gap: 48px;
    }

    .question-counter {
      font-size: 14px;
      color: var(--subtext);
    }

    .question-counter strong {
      color: var(--accent-alt);
      font-size: 32px;
      font-weight: 700;
    }

    .question-counter span {
      font-size: 18px;
    }

    .timer-display {
      font-size: 64px;
      font-weight: 700;
      color: var(--accent-alt);
      line-height: 1;
    }

    .timer-label {
      font-size: 12px;
      color: var(--subtext);
      text-align: right;
      margin-top: 4px;
    }

    .question-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .question-text {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 32px;
      max-width: 800px;
    }

    .response-count {
      font-size: 16px;
      color: var(--subtext);
      margin-bottom: 32px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .result-card {
      background-color: var(--surface);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-label {
      font-size: 18px;
    }

    .result-percent {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .result-bar {
      height: 12px;
      background-color: var(--bg);
    }

    .result-fill {
      height: 100%;
      background-color: var(--accent-alt);
      transition: width 0.5s ease;
    }

    .players-section {
      padding-top: 24px;
      border-top: 1px solid #222;
    }

    .players-line {
      font-size: 16px;
      color: var(--text);
    }

    .players-line span {
      color: var(--subtext);
    }

    .host-controls {
      position: fixed;
      bottom: 48px;
      right: 48px;
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 20px 48px;
      font-size: 18px;
    }

    .btn-secondary {
      background-color: var(--surface);
      border: 2px solid #444;
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Waiting state */
    .waiting-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .waiting-title {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .waiting-subtitle {
      font-size: 18px;
      color: var(--subtext);
      margin-bottom: 48px;
    }

    .player-count-big {
      font-size: 96px;
      font-weight: 700;
      color: var(--accent-alt);
      line-height: 1;
      margin-bottom: 8px;
    }

    .player-count-label {
      font-size: 16px;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .players-waiting-line {
      margin-top: 48px;
      font-size: 16px;
      color: var(--text);
    }

    .players-waiting-line span {
      color: var(--subtext);
    }

    /* Playing state */
    .playing-state {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .playing-state.active {
      display: flex;
    }

    .waiting-state.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
      <div class="header-left">
        <div class="dashboard-title">¿Quién Soy?</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
      </div>
      <div class="header-right">
        <div class="question-counter">
          <strong id="currentQuestion">0</strong>
          <span>/ <span id="totalQuestions">10</span></span>
        </div>
        <div>
          <div class="timer-display" id="timer">--</div>
          <div class="timer-label">segundos</div>
        </div>
      </div>
    </div>

    <!-- Waiting state (before game starts) -->
    <div class="waiting-state" id="waitingState">
      <div class="waiting-title">¿Quién Soy?</div>
      <div class="waiting-subtitle">Esperando jugadores...</div>
      <div class="player-count-big" id="playerCountBig">0</div>
      <div class="player-count-label">jugadores conectados</div>
      <div class="players-waiting-line" id="playersWaitingLine"><span>Agrega jugadores escaneando el QR</span></div>
    </div>

    <!-- Playing state (during game) -->
    <div class="playing-state" id="playingState">
      <div class="question-section">
        <div class="question-text" id="questionText"></div>
        <div class="response-count" id="responseCount"></div>
        <div class="results-grid" id="resultsGrid"></div>
      </div>
    </div>

    <div class="players-section">
      <div class="players-line" id="playersLine"></div>
    </div>
  </div>

  <div class="host-controls">
    <button class="btn" id="startBtn">Iniciar Juego</button>
    <button class="btn btn-secondary" id="nextBtn" style="display: none;">Siguiente</button>
  </div>

  <script src="js/questions.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
