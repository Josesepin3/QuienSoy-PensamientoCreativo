<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>¿Quién Soy? - Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      align-items: stretch;
      justify-content: stretch;
    }

    .quiz {
      width: 100%;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-counter {
      font-size: 14px;
      color: var(--subtext);
    }

    .question-counter strong {
      color: var(--accent-alt);
      font-weight: 700;
    }

    .timer {
      font-size: 14px;
      color: var(--accent-alt);
      font-weight: 600;
    }

    .timer.warning {
      color: #f38ba8;
      animation: blink 1s infinite;
    }

    .progress-bar {
      margin-bottom: 32px;
    }

    .question-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-text {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 20px;
      background-color: var(--surface);
      border: 2px solid var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent);
    }

    .option-btn.selected {
      border-color: var(--accent);
      background-color: rgba(137, 180, 250, 0.1);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn:disabled:hover {
      border-color: var(--surface);
    }

    .option-btn.selected:disabled {
      border-color: var(--accent);
      background-color: rgba(137, 180, 250, 0.1);
    }

    /* Waiting screen */
    .waiting-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .waiting-screen.active {
      display: flex;
    }

    .waiting-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .waiting-subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 48px;
    }

    .selected-answer {
      background-color: var(--surface);
      padding: 24px 48px;
      margin-bottom: 48px;
    }

    .selected-label {
      font-size: 12px;
      color: var(--subtext);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .selected-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .waiting-dots {
      font-size: 14px;
      color: var(--subtext);
    }

    .dots {
      display: inline-block;
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="quiz">
    <!-- Question screen -->
    <div class="question-section" id="questionScreen">
      <div class="quiz-header">
        <div class="question-counter">
          <strong id="currentQuestion">3</strong> / 10
        </div>
        <div class="timer" id="timer">14s</div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 30%;"></div>
      </div>

      <div class="question-text" id="questionText">¿Cuál es mi color favorito?</div>

      <div class="options" id="options">
        <button class="option-btn" data-index="0">Azul</button>
        <button class="option-btn" data-index="1">Verde</button>
        <button class="option-btn" data-index="2">Rojo</button>
        <button class="option-btn" data-index="3">Blanco</button>
      </div>
    </div>

    <!-- Waiting screen -->
    <div class="waiting-screen" id="waitingScreen">
      <div class="waiting-title">Respuesta enviada</div>
      <div class="waiting-subtitle">Esperando a los demás jugadores...</div>

      <div class="selected-answer">
        <div class="selected-label">Tu respuesta</div>
        <div class="selected-value" id="selectedAnswer">Rojo</div>
      </div>

      <div class="waiting-dots">Esperando<span class="dots">...</span></div>
    </div>
  </div>
  <script src="js/questions.js"></script>
  <script type="module" src="js/quiz.js"></script>
</body>
</html>
